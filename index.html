<div class="sw"><table><tr><th>#</th><th class="l"></th><th>${t('avg')}</th><th>${t('tot')}</th><th>${t('diff')}</th><th>${t('mp')}</th><th>${t('wl')}</th></tr>${st.map((e,i)=>{const lv=Math.round(e.ids.reduce((s,x)=>s+P(x).lv,0)/e.ids.length);return `<tr class="${i?'':'r1'}"><td>${i+1}</td><td class="l"><b>${esc(nm(e.id))}</b> <small class="sk s${lv}" style="padding:1px 6px;min-width:0;border-radius:6px">${t('sk')[lv][0]}</small></td><td>${e.avg.toFixed(1)}</td><td>${e.pts}${e.bonus?'*':''}</td><td>${e.d>0?'+':''}${e.d}</td><td>${e.mp}</td><td>${e.w}/${e.l}</td></tr>`}).join('')}</table></div>
${S.cu&&!fx()?`<p class="mut">* ${t('cuNote')}</p>`:''}<div class="row" style="margin-top:12px"><button class="btn lime" style="flex:1" onclick="copyLive()">${t('lst')}</button><button class="btn" style="flex:1" onclick="pic(1)">${t('pic')}</button></div></div>`}
function vHist(){return S.history.map((h,i)=>`<div class="card"><div class="row sp"><b>${h.d} · ${t('modes')[MK.indexOf(h.mode)]}</b><button class="x" onclick="delH(${i})">×</button></div><div class="mut">${h.players.length} ${t('players')} · ${h.rounds.length} ${t('round')}</div>
<div class="row" style="margin:8px 0"><button class="chip ${S.hs==='tot'?'':'on'}" onclick="S.hs='avg';render()">${t('avg')}</button><button class="chip ${S.hs==='tot'?'on':''}" onclick="S.hs='tot';render()">${t('tot')}</button></div><ol style="padding-left:20px">${hSt(h).slice(0,5).map(e=>`<li>${esc(e.n)} — ${S.hs==='tot'?e.pts+' ('+t('avg')+' '+e.avg+')':e.avg+' ('+t('tot')+' '+e.pts+')'}</li>`).join('')}</ol>
<details><summary class="mut">${t('matches')}</summary>${h.rounds.map(r=>`<p><b>${t('round')} ${r.n}</b><br>${r.m.map(m=>`${esc(m.c||'')}: ${esc(m.a)} ${m.sa}–${m.sb} ${esc(m.b)}`).join('<br>')}</p>`).join('')}</details>
<div class="row" style="margin-top:8px"><button class="btn lime" onclick="reuse(${i})">${t('reuse')}</button><button class="btn ghost" onclick="copyH(${i})">${t('copy')}</button><button class="btn ghost" aria-label="Download JPEG" title="Download JPEG" onclick="hPic(${i})"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg></button></div></div>`).join('')||`<div class="card"><h3>No tournaments yet</h3><p class="mut">Tap Finish &amp; save in Matches and it will show up here with scores and standings.</p></div>`
+lifeCard()+`<div class="card"><button class="btn ghost" onclick="expJ()">${t('exp')}</button><textarea id="jin" style="min-height:70px;margin:10px 0"></textarea><button class="btn ghost" onclick="impJ()">${t('impj')}</button></div>`}
function fm(){const e=$('#fm');if(!e)return;const q=FQ.trim().toLowerCase();if(!q||!S.rounds.length){e.innerHTML='';return}e.innerHTML=S.players.filter(p=>p.name.toLowerCase().includes(q)).slice(0,3).map(p=>'<div style="margin-bottom:8px"><b>'+esc(p.name)+'</b>'+S.rounds.map((R,i)=>{const m=R.m.find(m=>m.a.includes(p.id)||m.b.includes(p.id)),h=R.po?'Final':t('round')+' '+(i+1);if(!m)return '<br>'+h+': '+t('rest');const A=m.a.includes(p.id),mine=A?m.a:m.b,opp=A?m.b:m.a,f=A?m.sa:m.sb,o=A?m.sb:m.sa,sc=f+o>0?' ('+f+'-'+o+')':'';return '<br>'+h+': '+esc(m.c||'')+' - '+esc(tn(mine.filter(x=>x!=p.id))||'-')+' vs '+esc(tn(opp))+sc}).join('')+'</div>').join('')}
function render(){document.documentElement.lang=S.lang;document.documentElement.dataset.theme=S.theme||'';
$('#nav').innerHTML=['setup','matches','board','history'].map(k=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('');
const hm=S.tab==='home';$('#nav').style.display=['home','income','settings','hours','help'].includes(S.tab)?'none':'';$('#hb').style.display=hm?'none':'';$('#gb').style.display=hm?'':'none';$('#app').innerHTML=({home:vHome,setup:vSetup,matches:vMatches,board:vBoard,history:vHist,income:vInc,hours:vHours,settings:vSettings,help:vHelp})[S.tab]()+'<div id="toast" style="display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--lime);color:var(--navy);padding:10px 18px;border-radius:99px;font-weight:800;z-index:9">'+t('copied')+'</div>';if(S.tab==='setup')rl();if(S.tab==='matches')fm();if(UN&&!UN.shown)showUndo()}
S.lang='en';S.tab='home';render();
</script></body></html>
